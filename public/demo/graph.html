<script>
$("ptr").outerHTML = POINTER;
const GRAPH_SCREEN = `<div class="absolute inset-0 z-50 flex flex-col bg-canvas outline-none" data-koda-graph="1" data-inner="0">
    <header class="flex h-10 shrink-0 items-center justify-between gap-3 border-b border-hairline bg-panel px-4">
      <div class="flex min-w-0 items-center gap-2">
        <span id="h-glyph"></span>
        <h1 class="shrink-0 font-mono text-app-xs font-bold text-ink">Code graph</h1>
        <span id="caption" class="truncate text-app-xs text-muted"></span>
      </div>
      <div class="flex shrink-0 items-center gap-1.5">
        <div id="views" class="flex gap-0.5 rounded-lg border border-hairline bg-canvas p-0.5" role="radiogroup"></div>
        <button id="search" type="button" class="flex w-72 cursor-text items-center gap-2 rounded-lg border border-hairline bg-canvas px-2.5 py-1 text-app-2xs text-dim transition hover:border-command/50"><span id="search-glyph"></span><span class="grow text-left">Search symbols and files</span><kbd class="rounded border border-hairline bg-canvas px-1 py-0.5 font-mono text-app-2xs text-muted">⌘K</kbd></button>
        <button id="code-toggle" type="button" title="Show or hide the code (c)" aria-pressed="true" class="cursor-pointer rounded-md border border-command/40 bg-command/10 p-1.5 text-command transition"></button>

        <button type="button" aria-label="Restore the screen" title="Restore (or double-click the title bar)" class="flex size-6 cursor-pointer items-center justify-center rounded text-muted transition hover:bg-hover hover:text-ink"><span id="restore-glyph"></span></button>
      </div>
    </header>
    <div class="relative flex min-h-0 grow overflow-hidden">
      <aside id="tables" class="flex w-64 shrink-0 flex-col border-r border-hairline bg-panel" style="display:none"></aside>
      <section class="relative flex min-w-0 grow flex-col overflow-hidden">
        <div id="toolbar" class="relative z-20 shrink-0" style="display:none"></div>
        <div id="canvas-box" class="koda-graph-canvas relative min-h-0 min-w-0 grow cursor-grab overflow-hidden">

          <div id="hud"></div>
          <div class="absolute right-3 bottom-3 flex flex-col overflow-hidden rounded-md border border-hairline bg-panel shadow-lg shadow-black/30">
            <button type="button" title="Zoom in" class="flex size-8 cursor-pointer items-center justify-center font-mono text-app-sm text-muted transition hover:bg-hover hover:text-ink">+</button>
            <button type="button" title="Zoom out" class="flex size-8 cursor-pointer items-center justify-center border-t border-hairline font-mono text-app-sm text-muted transition hover:bg-hover hover:text-ink">−</button>
            <button type="button" title="Fit to screen" class="flex h-8 cursor-pointer items-center justify-center border-t border-hairline px-1 font-mono text-app-3xs text-muted uppercase transition hover:bg-hover hover:text-ink">Fit</button>
          </div>

      <aside id="table-panel" class="flex w-90 shrink-0 flex-col overflow-hidden border-l border-hairline bg-panel" style="display:none"></aside>
    </div>
  </div>`;
function openGraph() {
  openScreen("graph", GRAPH_SCREEN, { wide: true, maximized: true });
  $("h-glyph").outerHTML = icon("size-4 shrink-0 text-accent-indigo-bright", GLYPH.hub);
  $("search-glyph").outerHTML = icon("size-3.5", GLYPH.search);
  $("close-glyph").outerHTML = icon("size-3.5 shrink-0", GLYPH.close);
  $("restore-glyph").outerHTML = icon("size-3.5", GLYPH.restore);
  $("code-toggle").innerHTML = icon("size-3.5", GLYPH.code);
}
// The `/` command chips over the prompt box (stream/dock.rs command_list).
const commandChips = (name, description, keys) => `<div class="absolute right-0 bottom-full left-0 z-40 mb-2 flex flex-col gap-2 rounded-lg border border-hairline bg-elevated p-2 elevated-shadow enter"><div class="koda-no-scrollbar flex gap-1.5 overflow-x-auto" role="listbox" aria-label="Commands" aria-orientation="horizontal"><button type="button" role="option" aria-selected="true" class="shrink-0 cursor-pointer rounded-full border px-2.5 py-1 font-mono text-app-xs transition border-command bg-command text-canvas">${name}</button></div><div class="flex min-w-0 items-center gap-2.5 px-1"><span class="shrink-0 font-mono text-app-xs text-ink">${name}</span><span class="min-w-0 grow truncate text-app-2xs text-muted">${description}</span><span class="shrink-0"><kbd class="rounded border border-hairline bg-canvas px-1 py-0.5 font-mono text-app-2xs text-muted">${keys}</kbd></span></div></div>`;
const ASKED = "Deliveries to a slow endpoint fail again.";
function mountSession() {
  mountShell(sessionColumn(sessionStrip({ title: ASKED, turn: 24100, session: 24100, hit: "68.2%" })), {
    phase: "Finished", toolCalls: 5, doing: ASKED,
    sessions: [{ title: ASKED, ago: "2m ago", turns: 1, phase: "Finished", selected: true }, { title: "Webhooks time out in staging. Find out why and fix it.", ago: "18d ago", turns: 1 }, { title: "Rotate the webhook secret", ago: "22d ago", turns: 3 }],
    changes: [{ path: "src/webhooks/retry.rs", state: "M", added: 1, removed: 1 }],
    graph: [{ path: "src/webhooks/retry.rs", state: "M", definitions: 4, uses: 2, usedBy: 1 }],
    context: { used: 24100 },
  });
  $("log").innerHTML = said(ASKED) + calls([
    call({ kind: "read", detail: "src/webhooks/retry.rs", took: "0.1s" }),
    call({ kind: "edit", verb: "Edit", detail: "src/webhooks/retry.rs", took: "0.1s" }),
    call({ kind: "shell", detail: "cargo test webhooks", took: "7.9s" }),
  ]) + answer("Retries now use `deliver::client()`, so they wait 10 s like first deliveries. The webhook tests pass.") + footer("34s", { calls: 3, read: 1, edited: 1, added: 1, removed: 1 });
  $("dock-slot").innerHTML = dock({ title: ASKED });
}

const VIEWS = ["Symbol", "Flow", "Files", "Map", "Schema"];
const FLOAT = "absolute z-10 rounded-xl border border-hairline bg-panel/80 backdrop-blur-md elevated-shadow";
const CHIP = "inline-flex items-center gap-1.5 rounded-full border border-hairline px-2 py-0.5 text-app-2xs text-muted";
const KINDS = ["method", "function", "class", "interface", "trait", "protocol", "struct", "union", "enum", "type_alias", "file", "module"];
const kindClass = (kind) => (KINDS.includes(kind) ? `koda-kind-${kind}` : "koda-kind-other");
const clipped = (text, n) => ([...text].length <= n ? text : `${[...text].slice(0, n - 1).join("")}…`);
const pill = (kind) => `<span class="${kindClass(kind)} rounded-full px-2 py-px text-app-3xs font-semibold tracking-wide uppercase" style="color: var(--koda-kind); background: color-mix(in srgb, var(--koda-kind) 14%, transparent)">${kind}</span>`;

const MODULES = [
  { id: "src/http", symbols: 38, files: ["src/http/server.rs", "src/http/router.rs", "src/http/middleware.rs"], dependents: 2, layer: 2 },
  { id: "src/cli", symbols: 14, files: ["src/cli/main.rs", "src/cli/replay.rs"], dependents: 0, layer: 2 },
  { id: "src/webhooks", symbols: 27, files: ["src/webhooks/deliver.rs", "src/webhooks/retry.rs", "src/webhooks/signing.rs"], dependents: 4, layer: 1 },
  { id: "src/parser", symbols: 22, files: ["src/parser/chunk.rs", "src/parser/header.rs", "src/parser/body.rs"], dependents: 3, layer: 0 },
  { id: "src/db", symbols: 19, files: ["src/db/pool.rs", "src/db/users.rs", "src/db/deliveries.rs"], dependents: 6, layer: 0 },
];
const MODULE_LINKS = [
  ["src/http", "src/webhooks", 9, "calls 7 · imports 2"], ["src/http", "src/db", 4, "calls 3 · imports 1"], ["src/cli", "src/webhooks", 4, "calls 3 · imports 1"],
  ["src/cli", "src/db", 3, "calls 2 · imports 1"], ["src/webhooks", "src/parser", 5, "calls 4 · imports 1"], ["src/webhooks", "src/db", 6, "calls 5 · imports 1"],
];
const CHANGED = ["src/webhooks/retry.rs"];
const FILES = MODULES.reduce((n, m) => n + m.files.length, 0), SYMBOLS = MODULES.reduce((n, m) => n + m.symbols, 0);

const node = (id, name, kind, file, line, end, qualified) => ({ id, name, kind, file, line, end, qualified: qualified || name });
const N = {
  route: node("route", "route", "function", "src/http/router.rs", 22, 40, "http::router::route"),
  send_webhook: node("send_webhook", "send_webhook", "function", "src/webhooks/deliver.rs", 31, 43, "webhooks::deliver::send_webhook"),
  retries_on_503: node("retries_on_503", "retries_on_503", "function", "tests/webhooks.rs", 12, 28, "webhooks::retries_on_503"),
  stops_on_410: node("stops_on_410", "stops_on_410", "function", "tests/webhooks.rs", 30, 44, "webhooks::stops_on_410"),
  sign_payload: node("sign_payload", "sign_payload", "function", "src/webhooks/signing.rs", 8, 15, "webhooks::signing::sign_payload"),
  should_retry: node("should_retry", "should_retry", "function", "src/webhooks/retry.rs", 14, 22, "webhooks::retry::should_retry"),
  record_delivery: node("record_delivery", "record_delivery", "function", "src/db/deliveries.rs", 12, 30, "db::deliveries::record_delivery"),
  delay: node("delay", "delay", "method", "src/webhooks/retry.rs", 9, 11, "retry::Backoff::delay"),
  exhausted: node("exhausted", "exhausted", "method", "src/webhooks/retry.rs", 5, 7, "retry::Backoff::exhausted"),
  never_on_410: node("never_on_410", "never_on_410", "function", "src/webhooks/retry.rs", 48, 52, "retry::tests::never_on_410"),
};
const SYMBOL = {
  send_webhook: {
    node: N.send_webhook,
    callers: [[N.route, [24]], [N.retries_on_503, [18]], [N.stops_on_410, [36]]],
    callees: [[N.sign_payload, [33]], [N.should_retry, [37]], [N.record_delivery, [38]], [N.delay, [40]]],
    tests: 2, hops: 1, blast: { direct: 3, within: 6, files: 3, test_files: 1 },
    source: ["pub async fn send_webhook(hook: &Webhook, event: &Event) -> Result<Delivery> {", "    let body = serde_json::to_vec(event)?;", "    let signature = sign_payload(&hook.secret, &body);", "    let mut attempt = 0;", "    loop {", "        let reply = post(&hook.url, &body, &signature).await?;", "        if !should_retry(reply.status, attempt, &hook.backoff) {", "            return record_delivery(hook, &reply).await;", "        }", "        sleep(hook.backoff.delay(attempt)).await;", "        attempt += 1;", "    }", "}"],
  },
  should_retry: {
    node: N.should_retry,
    callers: [[N.send_webhook, [37]], [N.never_on_410, [50]]],
    callees: [[N.exhausted, [15]]],
    tests: 3, hops: 2, blast: { direct: 2, within: 7, files: 4, test_files: 1 },
    source: ["pub fn should_retry(status: u16, attempt: u32, backoff: &Backoff) -> bool {", "    if backoff.exhausted(attempt) {", "        return false;", "    }", "    match status {", "        408 | 429 | 500..=599 => true,", "        _ => !matches!(status, 400 | 401 | 410),", "    }", "}"],
  },
};
const ROUTE_SOURCE = ["pub async fn route(req: Request, state: &State) -> Response {", "    let hook = state.webhooks.find(req.param(\"id\"))?;", "    match send_webhook(&hook, &req.event()).await {", "        Ok(delivery) => Response::accepted(delivery),", "        Err(error) => Response::bad_gateway(error),", "    }", "}"];
const FLOW = [[N.route, null], [N.send_webhook, 24], [N.should_retry, 37]];
const FLOW_SOURCE = { route: [22, ROUTE_SOURCE], send_webhook: [31, SYMBOL.send_webhook.source], should_retry: [14, SYMBOL.should_retry.source] };

const TABLES = [
  { name: "users", x: 0, y: 40, set: 0, cols: [["id", "bigint", "PK"], ["email", "text", ""], ["created_at", "timestamptz", ""]] },
  { name: "webhooks", x: 250, y: 20, set: 0, cols: [["id", "bigint", "PK"], ["owner_id", "bigint", "FK"], ["url", "text", ""], ["secret", "text", ""], ["created_at", "timestamptz", ""]] },
  { name: "deliveries", x: 500, y: 60, set: 0, cols: [["id", "bigint", "PK"], ["webhook_id", "bigint", "FK"], ["status", "smallint", ""], ["attempts", "int", ""], ["last_error", "text?", ""], ["created_at", "timestamptz", ""]] },
  { name: "delivery_attempts", x: 750, y: 30, set: 0, cols: [["id", "bigint", "PK"], ["delivery_id", "bigint", "FK"], ["status", "smallint", ""], ["at", "timestamptz", ""]] },
];
const TABLE_EDGES = [[1, 0, "owner_id"], [2, 1, "webhook_id"], [3, 2, "delivery_id"]];

const state = {};
const base = (path) => path.split("/").pop();
const short = (q) => q.split("::").slice(-2).join("::");

function card(n, x, y, sub, act) {
  return { id: n.id, x, y, w: 230, h: 46, kind: n.kind, title: short(n.qualified), sub, badge: null, extra: [], look: "plain", act };
}
const columnTop = (count) => -((Math.max(count, 1) - 1) * 60) / 2;
function symbolPicture(name) {
  const g = SYMBOL[name], n = g.node;
  const cards = [{ ...card(n, 0, 0, "", null), w: 280, h: 62, title: n.name, sub: `${base(n.file)}:${n.line}–${n.end}`, look: "focus" }];
  const links = [], captions = [];
  for (const [side, list] of [[-1, g.callers], [1, g.callees]]) {
    const t = columnTop(list.length);
    captions.push([side * 400, t - 40, `${side < 0 ? "called by" : "calls"} · ${list.length}`]);
    list.forEach(([other, lines], row) => {
      const sub = other.file === n.file ? `same file · :${other.line}` : `${base(other.file)}:${other.line}`;
      cards.push(card(other, side * 400, t + row * 60, sub, other.id));
      const [from, to, tint] = side < 0 ? [other.id, n.id, "in"] : [n.id, other.id, "out"];
      links.push({ from, to, sides: ["right", "left"], line: "flow", tint, particle: true, delay: row * 0.3, period: 1.8, width: 1.6, hint: `calls line ${lines.join(", ")}` });
    });
  }
  return { cards, links, captions, key: `symbol:${name}` };
}
function mapPicture(selected) {
  const cards = [], biggest = Math.max(...MODULES.map((m) => m.symbols));
  for (const level of [2, 1, 0]) {
    const row = MODULES.filter((m) => m.layer === level);
    row.forEach((m, i) => {
      const touched = m.files.filter((f) => CHANGED.includes(f)).length;
      cards.push({ id: m.id, x: (i - (row.length - 1) / 2) * 300, y: (2 - level) * 150, w: 200 + 60 * Math.sqrt(m.symbols / biggest), h: 64, kind: "module", title: m.id, sub: `${m.symbols} symbols · ${m.files.length} files · ${m.dependents} depend on it`, badge: touched ? `${touched} changed` : null, extra: [], look: m.id === selected ? "focus" : "plain", act: m.id });
    });
  }
  const busiest = Math.max(...MODULE_LINKS.map((l) => l[2]));
  const links = [];
  for (const [source, target, edges, kinds] of MODULE_LINKS) {
    const picked = selected && (source === selected || target === selected);
    if (edges < 4 && !picked) continue;
    links.push({ from: source, to: target, sides: ["bottom", "top"], line: "flow", tint: "in", particle: picked || edges > busiest * 0.25, delay: 0, period: 2.4, width: Math.min(1 + Math.log2(edges) * 0.7, 6), hint: `${edges} edges · ${kinds}` });
  }
  return { cards, links, captions: [[0, -60, "entry points"], [0, 370, "foundations"]], key: "map" };
}
function flowPicture(selected) {
  const cards = [], links = [];
  FLOW.forEach(([n, line], i) => {
    const c = card(n, i * 330, i % 2 ? 46 : -46, `${base(n.file)}:${n.line}`, `step:${i}`);
    cards.push({ ...c, w: 250, h: 54, look: i === selected ? "focus" : "plain" });
    if (i) links.push({ from: FLOW[i - 1][0].id, to: n.id, sides: ["right", "left"], line: "flow", tint: "path", arrow: true, particle: true, period: 1.1 * FLOW.length, delay: (i - 1) * 1.1, width: 1.6, label: `line ${line}` });
  });
  return { cards, links, captions: [], key: "flow" };
}
function bounds(p) {
  let b = [Infinity, Infinity, -Infinity, -Infinity];
  for (const c of p.cards) b = [Math.min(b[0], c.x - c.w / 2), Math.min(b[1], c.y - c.h / 2), Math.max(b[2], c.x + c.w / 2), Math.max(b[3], c.y + c.h / 2)];
  for (const [x, y] of p.captions) b = [Math.min(b[0], x - 60), Math.min(b[1], y - 16), Math.max(b[2], x + 60), b[3]];
  return [b[0] - 40, b[1] - 40, b[2] - b[0] + 80, b[3] - b[1] + 80];
}
function fit(box) {
  const view = $("canvas-box");
  const [w, h] = [view.clientWidth, view.clientHeight];
  const scale = Math.min(Math.max(Math.min(w / box[2], h / box[3]), 0.08), 1.6) * 0.92;
  $("cam").style.transform = `translate(${((w - box[2] * scale) / 2 - box[0] * scale).toFixed(2)}px, ${((h - box[3] * scale) / 2 - box[1] * scale).toFixed(2)}px) scale(${scale.toFixed(4)})`;
  $("cam").style.transformOrigin = "0 0";
  $("zoom").textContent = `${Math.round(scale * 100)}% · scroll to pan · pinch or ⌘-scroll to zoom`;
}

function anchor(c, side) {
  return { left: [c.x - c.w / 2, c.y], right: [c.x + c.w / 2, c.y], top: [c.x, c.y - c.h / 2], bottom: [c.x, c.y + c.h / 2] }[side];
}
function curve(a, b, sides) {
  const [x0, y0] = anchor(a, sides[0]), [x1, y1] = anchor(b, sides[1]);
  const mid = [(x0 + x1) / 2, (y0 + y1) / 2];
  if (sides[0] === "top" || sides[0] === "bottom") return [`M${x0.toFixed(1)},${y0.toFixed(1)} C${x0.toFixed(1)},${mid[1].toFixed(1)} ${x1.toFixed(1)},${mid[1].toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`, mid];
  const dx = Math.max(Math.abs(x1 - x0) * 0.5, 60);
  const [c0, c1] = sides[0] === "left" ? [x0 - dx, x1 + dx] : [x0 + dx, x1 - dx];
  return [`M${x0.toFixed(1)},${y0.toFixed(1)} C${c0.toFixed(1)},${y0.toFixed(1)} ${c1.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`, mid];
}
const TINT = { in: "var(--koda-accent-indigo-bright)", out: "var(--koda-accent-purple-bright)", path: "url(#koda-graph-focus)" };
function cardMarkup(c, faded) {
  const focus = c.look === "focus", { w, h } = c;
  const titleY = focus ? 26 : h / 2 - 3, subY = focus ? 44 : h / 2 + 12;
  const look = { plain: "", focus: "koda-focus", more: "koda-more" }[c.look];
  const inner = `${focus ? `<rect class="koda-halo" x="-4" y="-4" width="${w + 8}" height="${h + 8}" rx="16"/>` : ""}<rect class="koda-card" width="${w}" height="${h}" rx="12"/>`
    + `<rect class="koda-kind-fill" x="0" y="10" width="3" height="${h - 20}" rx="1.5"/><circle class="koda-kind-fill" cx="20" cy="${focus ? 22 : h / 2}" r="${focus ? 7 : 5}" opacity="0.9"/>`
    + `<text x="36" y="${titleY}" font-size="${focus ? 15 : 12.5}" font-weight="600" class="fill-ink">${esc(clipped(c.title, focus ? 26 : 27))}</text>`
    + `<text x="36" y="${subY}" font-size="11" class="fill-dim">${esc(clipped(c.sub, focus ? 34 : 30))}</text>`
    + (focus ? `<text x="${w - 14}" y="22" text-anchor="end" font-size="9.5" letter-spacing="0.6" class="koda-kind-fill uppercase" font-weight="600">${c.kind}</text>` : "")
    + (c.badge ? `<text x="${w - 10}" y="${focus ? h - 14 : 14}" text-anchor="end" font-size="10.5" class="fill-muted">${c.badge}</text>` : "");
  return [`koda-node ${kindClass(c.kind)} ${look} ${faded ? "koda-dim" : ""}`, `transform: translate(${(c.x - w / 2).toFixed(1)}px, ${(c.y - h / 2).toFixed(1)}px)`, inner];
}
function draw({ settling = false } = {}) {
  const p = state.picture, byId = Object.fromEntries(p.cards.map((c) => [c.id, c]));
  const focus = state.hover;
  const near = new Set();
  if (focus) for (const l of p.links) if (l.from === focus || l.to === focus) { near.add(l.from); near.add(l.to); near.add(focus); }
  $("captions").innerHTML = p.captions.map(([x, y, t]) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="10.5" letter-spacing="1.2" class="fill-dim uppercase">${t}</text>`).join("");
  let edges = "", particles = "", labels = "";

  chapter("Trace a flow");
  await setView("Flow", id);
  state.step = 0;
  $("cards").innerHTML = "";
  layout();
  await show(flowPicture(0), id);
  await sleep(1600); alive(id);
  for (const step of [1, 2]) {
    await click(cardAt(FLOW[step][0].id), id);
    state.step = step;
    state.picture = flowPicture(step);
    draw(); drawer();
    await sleep(1700); alive(id);
  }

  chapter("The database schema");
  await setView("Schema", id);
  schemaScene();
  await sleep(1600); alive(id);
  await click(q('#cards [data-table="2"] .koda-schema-box'), id);
  state.table = 2;
  tableList(); tablePanel(); schemaScene();
  await sleep(4500); alive(id);
}
fitStage();
loop(play)();
</script>
</body>
</html>
