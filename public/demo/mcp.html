<!doctype html>
<html lang="en" data-theme="dark" data-density="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KodaCode MCP Demo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/icon.svg">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../assets/koda-ui.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="frame.css">
<script src="frame.js"></script>
<script src="compact.js"></script>
<script src="shell.js"></script>
</head>
<body>
<div class="stage" id="stage">
<div class="window">
  <div class="titlebar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
  <div id="app" class="min-h-0 grow"></div>
</div>
<div id="ptr"></div>
</div>
<script>
const SERVER_URL = "https://mcp.tickets.example/mcp";
const ASK = "Read issue ACME-142 in tickets about webhook retries, and tell me how you would fix it.";
const CONFIG = "~/.config/kc/config.toml";
const OLDER = [{ title: "Webhooks time out in staging. Find out why and fix it.", ago: "20d ago", turns: 1 }, { title: "Rotate the webhook secret", ago: "24d ago", turns: 3 }];
const q = (sel) => document.querySelector(sel);
const btn = (label, kind, glyph, id) => actionButton(label, kind, glyph, id || label);
// Choice (setting_rows.rs): a radio group of plain options.
const choice = (label, options, chosen) => `<div class="flex gap-0.5 rounded-lg border border-hairline bg-canvas p-0.5" role="radiogroup" aria-label="${label}">${options.map((o, i) => `<button type="button" role="radio" data-choice="${esc(o)}" aria-checked="${i === chosen}" class="${i === chosen ? "cursor-pointer rounded bg-command/15 ring-1 ring-inset ring-command/40 px-2.5 py-1 text-app-2xs text-ink" : "cursor-pointer rounded px-2.5 py-1 text-app-2xs text-dim transition hover:text-muted"}">${o}</button>`).join("")}</div>`;
const field = (label, value, multiline, id, typing) => `<label class="flex flex-col gap-1"><span class="text-app-2xs text-dim">${label}</span><div ${id ? `id="${id}"` : ""} aria-label="${esc(label)}" class="w-full rounded border border-hairline bg-panel px-2 py-1 font-mono text-app-xs text-ink whitespace-pre-wrap" style="min-height:${multiline ? 62 : 26}px">${esc(value)}${typing ? '<span class="caret"></span>' : ""}</div></label>`;

let m;
const fresh_mcp = () => ({ servers: [], form: null });

function serverRow(sv) {
  const [said, tone] = { login: ["needs sign-in", "text-accent-amber"], ready: ["ready, 23 tools", "text-accent-cyan-bright"] }[sv.status];
  return `<div class="flex items-center justify-between gap-3 border-t border-hairline-soft pt-2 first:border-t-0${sv.fresh ? " enter" : ""}">
    <div class="flex min-w-0 flex-col gap-0.5"><span class="font-mono text-app-xs text-ink">${sv.name}<span class="ml-2 text-app-2xs text-dim">yours</span></span><span class="font-mono text-app-2xs ${tone} whitespace-pre-wrap">${said}</span>${sv.signing ? `<span class="font-mono text-app-2xs text-muted">Finish signing in to ${sv.name} in your browser.</span><a title="https://auth.tickets.example/authorize" aria-label="Open the ${sv.name} sign-in page" class="flex items-center gap-1 self-start font-mono text-app-2xs text-accent-cyan-bright transition hover:text-ink">Open the sign-in page${icon("size-3", GLYPH.external)}</a>` : ""}</div>
    <div class="flex shrink-0 items-center gap-2">${btn("Sign in", "secondary")}${btn("Sign out", "secondary")}${btn("Restart", "secondary")}${btn("Disable", "secondary")}${btn("Edit", "secondary")}${btn("Remove", "danger")}</div>
  </div>`;
}

function form(f) {
  return `<div class="enter flex flex-col gap-2 rounded border border-hairline bg-canvas p-3">
    ${field("Name", f.name, false, "f-name", f.typing === "name")}
    ${choice("Transport", ["Command (stdio)", "URL (HTTP)"], f.http ? 1 : 0)}
    ${f.http
      ? field("URL", f.url, false, "f-url", f.typing === "url") + field("Headers, one `Name: value` per line; `$secret` keeps a value in the keychain", "", true) + field("Client ID, only if the provider asks for one registered for Koda", "", false)
      : field("Command", "", false) + field("Arguments, one per line", "", true) + field("Environment, one `NAME=value` per line; `$secret` keeps a value in the keychain", "", true)}
    <span class="text-app-2xs text-dim">Approval: Default follows Settings → Permissions &amp; sandbox → Approvals; Auto asks unless the server marks a tool read-only; Writes asks for anything not read-only; Always asks every call; Never asks.</span>
    ${choice("Approval", ["Default (Auto)", "Auto", "Writes", "Always", "Never"], 0)}
    <div class="flex items-center gap-2">${btn("Save server", "primary", GLYPH.check)}${btn("Cancel", "secondary")}</div>
  </div>`;
}

// SettingsScreen (settings/mod.rs) on its MCP servers page.
function settings() {
  const list = m.servers.length ? m.servers.map(serverRow).join("") : '<p class="font-mono text-app-2xs text-dim">No MCP servers yet.</p>';
  const tail = m.form ? form(m.form) : btn("Add server", "secondary");
  const servers = `<div class="flex w-full flex-col gap-3 py-3"><p class="text-app-2xs text-dim">Servers in .koda/mcp.toml are listed for the open project and start only after you approve them. Changes apply from the next session.</p>${list}${tail}</div>`;
  const picker = `<div class="relative min-w-0 "><button type="button" aria-label="Search pages" aria-haspopup="listbox" aria-expanded="false" class="flex cursor-pointer items-center gap-2 rounded-md border border-hairline bg-subtle px-2.5 py-1.5 font-mono text-app-xs text-ink transition hover:bg-hover"><span class="max-w-64 truncate">MCP servers</span>${icon("size-3 shrink-0 text-muted", GLYPH.chevronDown)}</button></div>`;
  const search = `<label class="ml-auto flex w-72 max-w-full items-center gap-2 rounded border border-hairline bg-canvas px-2 py-1.5">${icon("size-3.5 shrink-0 text-dim", GLYPH.search)}<span class="min-w-0 grow font-mono text-app-xs text-dim">Search all settings</span></label>`;
  const info = `<span class="text-accent-emerald-bright">✓</span><span class="shrink-0">Settings saved automatically to</span><span class="truncate text-ink/80">${CONFIG}</span>`;
  return `<div class="flex min-h-0 grow flex-col overflow-hidden bg-canvas" aria-label="Preferences">${screenHeader({ glyph: GLYPH.settings, tone: "cyan", title: "Preferences", caption: CONFIG })}
    <div class="flex shrink-0 flex-wrap items-center gap-2 border-b border-hairline px-5 py-2.5">${picker}${search}</div>
    <div id="body" class="min-h-0 grow overflow-y-auto"><div class="flex w-full flex-col gap-5 px-5 py-5">
      <div class="flex flex-col gap-1"><h1 class="text-app font-semibold text-ink">MCP servers</h1><p class="text-app-sm leading-relaxed text-muted">Tools from Model Context Protocol servers. Koda speaks MCP 2026-07-28 only.</p></div>
      <section class="flex flex-col rounded-lg border border-hairline bg-panel"><div class="flex flex-col gap-0.5 rounded-t-lg border-b border-hairline bg-subtle px-4 py-3"><h2 class="text-app-sm font-semibold text-ink">Servers</h2><p class="text-app-xs text-muted">Your servers apply to every project. A project can add its own in .koda/mcp.toml.</p></div>
        <div class="flex flex-col px-4"><div class="flex flex-col gap-2 border-t border-hairline-soft py-3 first:border-t-0"><div class="w-full min-w-0">${servers}</div></div></div></section>
    </div></div>
    ${screenFooter(info, btn("Reset to Defaults", "secondary", GLYPH.history) + btn("Open config file", "secondary", GLYPH.external) + btn("Close", "secondary", GLYPH.close))}
  </div>`;
}
const paint = () => openScreen("settings", settings());
async function typeInto(apply, text, id, speed = 26) { for (let i = 1; i <= text.length; i++) { apply(text.slice(0, i)); paint(); await sleep(speed); alive(id); } }

const GROUP = '<div class="flex flex-col py-1">';
function add(html) {
  const last = $("log").lastElementChild;
  if (html.startsWith(GROUP) && last?.dataset.calls) last.insertAdjacentHTML("beforeend", html.slice(GROUP.length, -6));
  else $("log").insertAdjacentHTML("beforeend", html.startsWith(GROUP) ? html.replace(GROUP, '<div data-calls="1" class="flex flex-col py-1">') : html);
  $("scroll").scrollTop = $("scroll").scrollHeight;
}
function finishRow(spec) {
  const groups = $("log").querySelectorAll("[data-calls]"), rows = groups[groups.length - 1];
  rows.lastElementChild.outerHTML = call(spec);
  rows.lastElementChild.classList.remove("enter");
}

async function play(id) {
  const p = $("pointer"); p.style.left = "640px"; p.style.top = "820px";
  m = fresh_mcp();
  mountShell(sessionColumn(), { sessions: OLDER, more: 0 });
  chapter("MCP servers in Settings");
  paint();
  await sleep(1400); alive(id);
  chapter("Adding an issue tracker's server");
  await click(q('[data-act="Add server"]'), id);
  m.form = { name: "", http: false, url: "", typing: "name" }; paint(); await sleep(500); alive(id);
  await pointTo($("f-name"), id, 0.1);
  await typeInto((t) => { m.form.name = t; }, "tickets", id, 70);
  await click(q('[data-choice="URL (HTTP)"]'), id);
  m.form.http = true; m.form.typing = "url"; paint(); await sleep(500); alive(id);
  await pointTo($("f-url"), id, 0.1);
  await typeInto((t) => { m.form.url = t; }, SERVER_URL, id, 22);
  await sleep(400); alive(id);
  await click(q('[data-act="Save server"]'), id);
  m.form = null; m.servers = [{ name: "tickets", status: "login", fresh: true }]; paint(); await sleep(1500); alive(id);
  m.servers[0].fresh = false;
  chapter("Signing in with OAuth");
  await click(q('[data-act="Sign in"]'), id);
  m.servers[0].signing = true; paint(); await sleep(2600); alive(id);
  m.servers[0].signing = false; m.servers[0].status = "ready"; paint(); await sleep(2400); alive(id);
  await click(q('[data-act="Close"]'), id);
  closeScreen();

  chapter("Asking about an issue");
  await sleep(700); alive(id);
  await click($("prompt"), id);
  for (let i = 1; i <= ASK.length; i++) { $("dock-slot").innerHTML = dock({ text: ASK.slice(0, i), caret: true }); await sleep(20); alive(id); }
  await sleep(500); alive(id);
  await click($("send"), id);
  const sess = { title: ASK, ago: "just now", turns: 1, phase: "Working", selected: true };
  shell({ phase: "Working", doing: ASK, sessions: [sess, ...OLDER], context: { used: 7400 } });
  $("strip-slot").innerHTML = sessionStrip({ title: ASK, turn: 0, session: 0 });
  $("dock-slot").innerHTML = dock({ title: ASK, working: true, activity: "Thinking", elapsed: "1s" });
  add(said(ASK));
  await sleep(900); alive(id);
  chapter("The agent calls the server's tool");
  const issue = { kind: "mcp", verb: "tickets", detail: "Get issue" };
  add(calls([call({ ...issue, status: "running" })]));
  shell({ toolCalls: 1 });
  $("dock-slot").innerHTML = dock({ title: ASK, working: true, activity: "tickets Get issue", elapsed: "3s" });
  await sleep(1100); alive(id);
  finishRow({ ...issue, took: "1.1s" });
  shell({ context: { used: 12500 } });
  add(calls([call({ kind: "read", detail: "src/webhooks/retry.rs", status: "running" })]));
  shell({ toolCalls: 2 });
  await sleep(800); alive(id);
  finishRow({ kind: "read", detail: "src/webhooks/retry.rs", took: "0.1s" });
  shell({ context: { used: 17000 } });
  await sleep(500); alive(id);
  chapter("The answer");
  add(answer("ACME-142 says a delivery to an endpoint that keeps answering 503 is retried forever. In `src/webhooks/retry.rs`, `should_retry` returns true for every 5xx, and the loop has no limit. I would stop after `max_attempts` and record the delivery as failed."));
  add(footer("4.2s", { calls: 2, read: 1 }));
  shell({ phase: "Finished", sessions: [{ ...sess, phase: "Finished" }, ...OLDER], context: { used: 18700 } });
  $("strip-slot").innerHTML = sessionStrip({ title: ASK, turn: 18700, session: 18700, hit: "58.3%" });
  $("dock-slot").innerHTML = dock({ title: ASK });
  await sleep(4200); alive(id);
}
$("ptr").outerHTML = POINTER;
fitStage();
loop(play)();
</script>
</body>
</html>
