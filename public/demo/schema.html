<!doctype html>
<html lang="en" data-theme="dark" data-density="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KodaCode Schema Demo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/icon.svg">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../assets/koda-ui.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="frame.css">
<style>
  .koda-schema-edge { transition: opacity .45s ease, stroke-width .2s; }
  .edge-wait { opacity: 0 !important; }
  .koda-schema-node { transition: transform 620ms cubic-bezier(.2, .8, .2, 1), opacity 300ms ease; }
  .koda-schema-node.koda-arriving { opacity: 0; }
  .koda-schema-edge.koda-shown { opacity: 1 !important; stroke-width: 2.4; }
  .keycap { position: absolute; left: 50%; bottom: 40px; z-index: 65; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--koda-hairline); background: color-mix(in srgb, var(--koda-elevated) 92%, transparent); box-shadow: 0 12px 30px rgb(0 0 0 / .4); font: 600 13px var(--font-mono); color: var(--koda-ink); }
  .keycap kbd { min-width: 22px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--koda-hairline); background: var(--koda-canvas); text-align: center; font: inherit; }
  .keycap span { font-weight: 400; color: var(--koda-muted); }
</style>
<script src="frame.js"></script>
<script src="compact.js"></script>
<script src="shell.js"></script>
</head>
<body>
<div class="stage" id="stage">
<div class="window">
  <div class="titlebar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
  <div class="relative min-h-0 grow">
    <div id="app" class="h-full"></div>
    <div id="graph-screen" class="absolute inset-0 z-50 flex flex-col bg-canvas outline-none" data-koda-graph="1" style="display:none">
      <header class="flex h-10 shrink-0 items-center justify-between gap-3 border-b border-hairline bg-panel px-4">
        <div class="flex min-w-0 items-center gap-2">
          <span id="h-glyph"></span>
          <h1 class="shrink-0 font-mono text-app-xs font-bold text-ink">Code graph</h1>
          <span id="caption" class="truncate text-app-xs text-muted"></span>
        </div>
        <div class="flex shrink-0 items-center gap-1.5">
          <div id="views" class="flex gap-0.5 rounded-lg border border-hairline bg-canvas p-0.5" role="radiogroup"></div>
          <button type="button" class="flex w-72 cursor-text items-center gap-2 rounded-lg border border-hairline bg-canvas px-2.5 py-1 text-app-2xs text-dim transition hover:border-command/50"><span id="search-glyph"></span><span class="grow text-left">Search symbols and files</span><kbd class="rounded border border-hairline bg-canvas px-1 py-0.5 font-mono text-app-2xs text-muted">⌘K</kbd></button>
          <button id="code-toggle" type="button" title="Show or hide the code (c)" aria-pressed="true" class="cursor-pointer rounded-md border border-command/40 bg-command/10 p-1.5 text-command transition"></button>
          <button id="close" type="button" class="flex cursor-pointer items-center gap-1.5 rounded border px-3 py-1 text-app-xs transition border-hairline bg-subtle text-ink/80 hover:bg-hover hover:text-ink"><span id="close-glyph"></span>Close</button>
          <button type="button" aria-label="Restore the screen" title="Restore (or double-click the title bar)" class="flex size-6 cursor-pointer items-center justify-center rounded text-muted transition hover:bg-hover hover:text-ink"><span id="restore-glyph"></span></button>
        </div>
      </header>
      <div class="relative flex min-h-0 grow overflow-hidden">
        <aside id="table-list" class="flex w-64 shrink-0 flex-col border-r border-hairline bg-panel" style="display:none"></aside>
        <section class="relative flex min-w-0 grow flex-col overflow-hidden">
          <div id="toolbar" class="relative z-20 shrink-0" style="display:none"></div>
          <div class="relative flex min-h-0 grow flex-col">
            <div id="canvas-box" class="koda-graph-canvas relative min-h-0 min-w-0 grow cursor-grab overflow-hidden">
              <svg class="absolute inset-0 size-full select-none font-mono"><defs><linearGradient id="koda-graph-focus" x1="0" x2="1"><stop offset="0" stop-color="var(--koda-accent-indigo-bright)"/><stop offset="1" stop-color="var(--koda-accent-purple-bright)"/></linearGradient></defs><g id="cam" class="koda-glide"><g id="captions"></g><g id="edges"></g><g id="particles"></g><g id="nodes"></g></g></svg>
              <div class="absolute right-3 bottom-3 flex flex-col overflow-hidden rounded-md border border-hairline bg-panel shadow-lg shadow-black/30">
                <button type="button" title="Zoom in" class="flex size-8 cursor-pointer items-center justify-center font-mono text-app-sm text-muted transition hover:bg-hover hover:text-ink">+</button>
                <button type="button" title="Zoom out" class="flex size-8 cursor-pointer items-center justify-center border-t border-hairline font-mono text-app-sm text-muted transition hover:bg-hover hover:text-ink">−</button>
                <button type="button" title="Fit to screen" class="flex h-8 cursor-pointer items-center justify-center border-t border-hairline px-1 font-mono text-app-3xs text-muted uppercase transition hover:bg-hover hover:text-ink">Fit</button>
              </div>
              <div id="zoom" class="pointer-events-none absolute bottom-3 left-3 rounded bg-panel/80 px-2 py-1 font-mono text-app-3xs text-dim"></div>
            </div>
            <div id="keys"></div>
            <div id="hud"></div>
            <div id="text-view"></div>
          </div>
        </section>
        <aside id="table-panel" class="flex w-90 shrink-0 flex-col overflow-hidden border-l border-hairline bg-panel" style="display:none"></aside>
      </div>
    </div>
    <div id="keycap"></div>
  </div>
</div>
<div id="ptr"></div>
</div>
<script>

const VIEWS = ["Symbol", "Flow", "Files", "Map", "Schema"];
const DOTS = ["bg-accent-cyan", "bg-accent-indigo", "bg-accent-purple"];
const FILLS = ["fill-accent-cyan", "fill-accent-indigo", "fill-accent-purple"];
const SETS = [["migrations", "SQL"], ["prisma", "SQL"], ["src/audit", "MongoDB"]];
const BOX_W = 210, HEAD = 28, ROW_H = 18;
const SCHEMA = [
  { name: "accounts", set: 0, x: 0, y: 150, cols: [["id", "bigint", "PK"], ["name", "text"], ["plan", "text"], ["created_at", "timestamptz"]] },
  { name: "api_keys", set: 0, x: -20, y: 400, cols: [["id", "bigint", "PK"], ["account_id", "bigint", "FK"], ["hash", "text"], ["last_used", "timestamptz?"]] },
  { name: "webhooks", set: 0, x: 290, y: 90, cols: [["id", "bigint", "PK"], ["account_id", "bigint", "FK"], ["url", "text"], ["secret", "text"], ["active", "bool"]] },
  { name: "webhook_deliveries", set: 0, x: 580, y: 40, cols: [["id", "bigint", "PK"], ["webhook_id", "bigint", "FK"], ["event_id", "uuid"], ["status", "smallint"], ["attempts", "int"], ["last_error", "text?"]] },
  { name: "delivery_attempts", set: 0, x: 870, y: 0, cols: [["id", "bigint", "PK"], ["delivery_id", "bigint", "FK"], ["status", "smallint"], ["at", "timestamptz"]] },
  { name: "events", set: 1, x: 580, y: 320, cols: [["id", "uuid", "PK"], ["account_id", "bigint?", "FK"], ["kind", "text"], ["payload", "jsonb"]] },
  { name: "audit_log", set: 2, x: 290, y: 400, note: "collection", cols: [["_id", "ObjectId", "PK"], ["account_id", "ObjectId"], ["webhook_id", "ObjectId"], ["action", "string"]] },
];
const VIEW = { name: "delivery_stats", x: 870, y: 230, reads: [3, 4] };
const LINKS = [
  { from: 1, to: 0, col: "account_id", kind: "required" },
  { from: 2, to: 0, col: "account_id", kind: "required" },
  { from: 3, to: 2, col: "webhook_id", kind: "required" },
  { from: 4, to: 3, col: "delivery_id", kind: "required" },
  { from: 5, to: 0, col: "account_id", kind: "nullable" },
  { from: 3, to: 5, col: "event_id", kind: "implied" },
  { from: 6, to: 0, col: "account_id", kind: "virtual" },
  { from: 6, to: 2, col: "webhook_id", kind: "lookup" },
];
const EDGE_CLASS = { required: "koda-schema-edge", nullable: "koda-schema-edge koda-nullable", implied: "koda-schema-edge koda-implied", virtual: "koda-schema-edge koda-reverse", lookup: "koda-schema-edge koda-lookup", reads: "koda-schema-edge koda-reads" };
const KEY_ROWS = [["required", "required"], ["nullable", "nullable"], ["implied", "implied"], ["virtual", "virtual"], ["lookup", "$lookup in code"], ["reads", "view reads"]];
const at = (name) => SCHEMA.findIndex((t) => t.name === name);
const PATH = [at("webhook_deliveries"), at("webhooks"), at("accounts")];
const PATH_EDGES = [2, 1];
const SQL = ["SELECT * FROM webhook_deliveries", "JOIN webhooks ON webhooks.id = webhook_deliveries.webhook_id", "JOIN accounts ON accounts.id = webhooks.account_id;"];
const SQL_IMPLIED = ["SELECT * FROM webhook_deliveries", "JOIN events ON events.id = webhook_deliveries.event_id", "JOIN accounts ON accounts.id = events.account_id;"];

const MODULES = [["src/http", 0, -150, 38, 3, 2], ["src/cli", 0, 150, 14, 2, 0], ["src/webhooks", 150, 0, 27, 3, 4], ["src/parser", 300, -150, 22, 3, 3], ["src/db", 300, 150, 19, 3, 6]];
const MODULE_LINKS = [[0, 2], [1, 2], [2, 3], [2, 4], [0, 4]];

const ui = {};
const geo = (t) => ({ x: t.x, y: t.y, w: BOX_W, h: HEAD + t.cols.length * ROW_H + 8 });
const viewGeo = () => ({ x: VIEW.x, y: VIEW.y, w: BOX_W, h: HEAD + 26 });

function header() {
  $("views").innerHTML = VIEWS.map((v) => `<button type="button" role="radio" data-view="${v}" aria-checked="${v === ui.view}" class="${v === ui.view ? "flex-1 rounded bg-command/15 ring-1 ring-inset ring-command/40 px-2.5 py-1 text-app-2xs text-ink" : "flex-1 rounded px-2.5 py-1 text-app-2xs text-dim transition hover:text-muted"}">${v}</button>`).join("");
  $("caption").textContent = ui.view === "Schema" ? `${SCHEMA.length} tables · ${LINKS.length} relations` : "14 files · 120 symbols · 5 folders";
}
function fit(box) {
  const view = $("canvas-box"), [w, h] = [view.clientWidth, view.clientHeight];
  const scale = Math.min(Math.max(Math.min(w / box[2], h / box[3]), 0.08), 1.6) * 0.92;
  $("cam").style.transformOrigin = "0 0";
  $("cam").style.transform = `translate(${((w - box[2] * scale) / 2 - box[0] * scale).toFixed(2)}px, ${((h - box[3] * scale) / 2 - box[1] * scale).toFixed(2)}px) scale(${scale.toFixed(4)})`;
  $("zoom").textContent = `${Math.round(scale * 100)}% · scroll to pan · pinch or ⌘-scroll to zoom`;
}

function mapScene() {
  $("edges").innerHTML = MODULE_LINKS.map(([a, b]) => {
    const [, ya, xa] = MODULES[a], [, yb, xb] = MODULES[b];
    return `<path class="koda-edge koda-flow" stroke="var(--koda-accent-indigo-bright)" stroke-width="2" d="M${xa},${ya + 32} C${xa},${(ya + yb) / 2 + 16} ${xb},${(ya + yb) / 2 + 16} ${xb},${yb - 32}"/>`;
  }).join("");
  $("nodes").innerHTML = MODULES.map(([id, y, x, symbols, files, dependents]) => {
    const w = 200 + 60 * Math.sqrt(symbols / 38);
    return `<g class="koda-node koda-kind-module" style="transform: translate(${x - w / 2}px, ${y - 32}px)"><rect class="koda-card" width="${w}" height="64" rx="12"/><rect class="koda-kind-fill" x="0" y="10" width="3" height="44" rx="1.5"/><circle class="koda-kind-fill" cx="20" cy="32" r="5" opacity="0.9"/><text x="36" y="29" font-size="12.5" font-weight="600" class="fill-ink">${id}</text><text x="36" y="44" font-size="11" class="fill-dim">${symbols} symbols · ${files} files · ${dependents} depend on it</text></g>`;
  }).join("");
  $("captions").innerHTML = `<text x="0" y="-60" text-anchor="middle" font-size="10.5" letter-spacing="1.2" class="fill-dim uppercase">entry points</text><text x="0" y="370" text-anchor="middle" font-size="10.5" letter-spacing="1.2" class="fill-dim uppercase">foundations</text>`;
  $("particles").innerHTML = "";
  fit([-340, -100, 680, 500]);
}

function side(a, b) {
  if (Math.abs(a.x - b.x) < 60) return [[a.x, "left"], [b.x, "left"]];
  return a.x > b.x ? [[a.x, "left"], [b.x + b.w, "right"]] : [[a.x + a.w, "right"], [b.x, "left"]];
}
function edgePath(link) {
  const t = SCHEMA[link.from], ga = geo(t), gb = geo(SCHEMA[link.to]);
  const row = t.cols.findIndex(([c]) => c === link.col);
  const [[x0, s0], [x1, s1]] = side(ga, gb);
  const y0 = ga.y + HEAD + row * ROW_H + 9, y1 = gb.y + HEAD / 2;
  const bend = (s) => (s === "left" ? -70 : 70);
  return `M${x0},${y0} C${x0 + bend(s0)},${y0} ${x1 + bend(s1)},${y1} ${x1},${y1}`;
}
function readsPath(table) {
  const g = geo(SCHEMA[table]), v = viewGeo();
  const [[x0, s0], [x1, s1]] = side(v, g);
  const bend = (s) => (s === "left" ? -60 : 60);
  return `M${x0},${v.y + HEAD / 2} C${x0 + bend(s0)},${v.y + HEAD / 2} ${x1 + bend(s1)},${g.y + HEAD / 2} ${x1},${g.y + HEAD / 2}`;
}
function edgeState(index, link) {
  if (ui.path) return PATH_EDGES.includes(index) ? "koda-path" : "koda-faded";
  if (ui.kind) return link.kind === ui.kind ? "koda-shown" : "koda-faded";
  const focus = ui.hover ?? ui.table;
  if (focus == null) return "";
  if (link.from === focus) return "koda-out";
  if (link.to === focus) return "koda-in";
  return "koda-faded";
}
function near(i) {
  if (ui.path) return PATH.includes(i);
  if (ui.kind) return LINKS.some((l) => l.kind === ui.kind && (l.from === i || l.to === i)) || (ui.kind === "reads" && VIEW.reads.includes(i));
  const focus = ui.hover ?? ui.table;
  return focus == null || focus === i || LINKS.some((l) => (l.from === focus && l.to === i) || (l.to === focus && l.from === i));
}
function boxMarkup(t, i) {
  const g = geo(t), sel = ui.table === i;
  const head = `M 0 9 a 9 9 0 0 1 9 -9 h ${g.w - 18} a 9 9 0 0 1 9 9 v ${HEAD - 9} h ${-g.w} z`;
  const rows = t.cols.map(([c, k, tag], r) => {
    const y = HEAD + r * ROW_H + 13;
    return `<text x="12" y="${y}" font-size="10.5" class="fill-ink">${c}</text>${tag ? `<text x="${g.w - 8 - k.length * 6 - 12}" y="${y}" text-anchor="end" font-size="9" class="${tag === "PK" ? "fill-accent-amber-bright" : "fill-accent-cyan-bright"}">${tag}</text>` : ""}<text x="${g.w - 8}" y="${y}" text-anchor="end" font-size="9.5" class="fill-dim">${k}</text>`;
  }).join("");
  return `<title>${t.name}</title><rect class="koda-schema-box" width="${g.w}" height="${g.h}" rx="9"/><path class="koda-schema-head" d="${head}"/><rect class="${FILLS[t.set]}" y="7" width="3" height="${HEAD - 14}" rx="1.5"/><text x="12" y="18" font-size="11.5" font-weight="700" class="fill-ink">${t.name}</text>${t.note ? `<text x="${g.w - 8}" y="18" text-anchor="end" font-size="9.5" class="fill-dim">${t.note}</text>` : ""}${rows}`;
}
function viewMarkup() {
  const v = viewGeo();
  return `<rect class="koda-schema-box" width="${v.w}" height="${v.h}" rx="9"/><text x="12" y="18" font-size="11.5" font-weight="700" class="fill-ink">${VIEW.name}</text><text x="${v.w - 8}" y="18" text-anchor="end" font-size="9.5" class="fill-accent-purple">view</text><text x="12" y="${HEAD + 13}" font-size="10" class="fill-accent-purple">reads webhook_deliveries, delivery_…</text>`;
}
function schemaScene({ arriving = false, waiting = false } = {}) {
  let edges = "", particles = "";
  LINKS.forEach((l, i) => {
    edges += `<path id="schema-edge-${i}" class="${EDGE_CLASS[l.kind]} ${edgeState(i, l)} ${waiting ? "edge-wait" : ""}" d="${edgePath(l)}"/>`;
    if (ui.path && PATH_EDGES.includes(i)) particles += `<circle class="koda-particle" r="3.4" fill="var(--koda-accent-cyan-bright)" style="color: var(--koda-accent-cyan-bright)"><animateMotion dur="1.6s" repeatCount="indefinite" begin="${PATH_EDGES.indexOf(i) * 0.8}s"><mpath href="#schema-edge-${i}"/></animateMotion></circle>`;
  });
  for (const r of VIEW.reads) {
    const lit = ui.kind === "reads" ? "koda-shown" : ui.kind || ui.path || ((ui.hover ?? ui.table) != null && !VIEW.reads.includes(ui.hover ?? ui.table)) ? "koda-faded" : "";
    edges += `<path class="${EDGE_CLASS.reads} ${lit} ${waiting ? "edge-wait" : ""}" d="${readsPath(r)}"/>`;
  }
  $("edges").innerHTML = edges;
  $("particles").innerHTML = particles;
  $("captions").innerHTML = "";
  const host = $("nodes");
  if (!host.querySelector("[data-table]")) host.innerHTML = "";
  SCHEMA.forEach((t, i) => {
    let g = host.querySelector(`[data-table="${i}"]`);
    if (!g) { g = svgEl("g", { "data-table": i }); host.append(g); }
    const box = geo(t);
    g.setAttribute("class", `koda-schema-node cursor-pointer ${ui.table === i ? "koda-sel" : ""} ${arriving ? "koda-arriving" : ""}`);
    g.setAttribute("style", `transform: translate(${arriving ? 450 - box.w / 2 : box.x}px, ${arriving ? 200 : box.y}px); opacity: ${arriving ? 0 : near(i) ? 1 : 0.3}`);
    g.innerHTML = boxMarkup(t, i);
  });
  let v = host.querySelector("[data-view-node]");
  if (!v) { v = svgEl("g", { "data-view-node": "1" }); host.append(v); }
  const viewNear = ui.kind === "reads" || (!ui.kind && !ui.path && ((ui.hover ?? ui.table) == null || VIEW.reads.includes(ui.hover ?? ui.table)));
  v.setAttribute("class", "koda-schema-node koda-view cursor-pointer");
  v.setAttribute("style", `transform: translate(${arriving ? 450 - BOX_W / 2 : VIEW.x}px, ${arriving ? 200 : VIEW.y}px); opacity: ${arriving ? 0 : viewNear ? 1 : 0.3}`);
  v.innerHTML = viewMarkup();
  fit([-120, -30, 1240, 560]);
}

function tableList() {
  const groups = SETS.map(([folder, store], set) => {
    const rows = SCHEMA.map((t, i) => [t, i]).filter(([t]) => t.set === set).sort(([a], [b]) => a.name.localeCompare(b.name));
    const views = set === 0 ? `<button type="button" class="flex w-full cursor-pointer items-center gap-2 py-1 pr-3 pl-7 text-left transition hover:bg-hover"><span class="min-w-0 grow truncate font-mono text-app-xs text-ink">${VIEW.name}</span><span class="shrink-0 rounded border px-1 font-mono text-app-3xs border-accent-purple/40 text-accent-purple">view</span><span class="shrink-0 font-mono text-app-3xs text-dim">2</span></button>` : "";
    return `<div class="flex items-center gap-2 px-3 pt-3.5 pb-1.5 text-app-2xs font-semibold text-ink"><span class="size-2 shrink-0 rounded-full ${DOTS[set]}"></span><span class="truncate">${folder}</span><span class="shrink-0 font-normal text-dim">${store}</span></div>${rows.map(([t, i]) => `<button type="button" data-row="${i}" class="${ui.table === i ? "flex w-full items-center gap-2 bg-accent-cyan/14 py-1 pr-3 pl-7 text-left" : "flex w-full cursor-pointer items-center gap-2 py-1 pr-3 pl-7 text-left transition hover:bg-hover"}"><span class="min-w-0 grow truncate font-mono text-app-xs text-ink">${t.name}</span><span class="shrink-0 font-mono text-app-3xs text-dim">${t.cols.length}</span></button>`).join("")}${views}`;
  }).join("");
  $("table-list").innerHTML = `<div class="flex h-10 shrink-0 items-center gap-2 border-b border-hairline px-3">${icon("size-3.5 shrink-0 text-dim", GLYPH.search)}<span class="min-w-0 grow font-mono text-app-xs text-dim">Find a table…  /</span></div><div class="min-h-0 grow overflow-y-auto pb-3">${groups}</div>`;
}
const SEG = "flex rounded-md bg-subtle p-0.5", SEG_ON = "cursor-pointer rounded px-2.5 py-1 text-app-2xs bg-elevated text-ink", SEG_OFF = "cursor-pointer rounded px-2.5 py-1 text-app-2xs text-muted transition hover:text-ink";
const BTN = "flex cursor-pointer items-center gap-1.5 rounded-md border border-hairline px-2.5 py-1 text-app-2xs text-muted transition hover:border-accent-cyan/40 hover:text-ink";
const BTN_ON = "flex cursor-pointer items-center gap-1.5 rounded-md border border-accent-cyan/55 bg-accent-cyan/10 px-2.5 py-1 text-app-2xs text-accent-cyan-bright";
const LOOKS = ["Map", "Mermaid", "DBML", "Graphviz"];
function toolbar() {
  const text = ui.look !== "Map";
  const middle = text
    ? `<div class="${SEG}" title="What goes into the text">${["Visible", "Current path", "Selected + neighbours"].map((n) => `<button type="button" data-scope="${n}" class="${n === ui.scope ? SEG_ON : SEG_OFF}">${n}</button>`).join("")}</div>`
    : `<div class="${SEG}" title="What each table shows">${["Auto", "Names", "Keys", "All fields"].map((n, i) => `<button type="button" class="${i ? SEG_OFF : SEG_ON}">${n}</button>`).join("")}</div><button type="button" class="${BTN}">Show<span class="text-dim">${SCHEMA.length + 1}</span></button>`;
  const trailing = text
    ? `<button type="button" class="${BTN_ON}">Source</button><button type="button" class="${BTN}">Copy</button><button type="button" class="${BTN_ON}">Save…</button>`
    : `<button id="path-btn" type="button" title="Find how two tables join (p)" class="${ui.pop ? BTN_ON : BTN}">↝ Path to…</button><button type="button" class="${BTN}">Health<span class="font-mono text-app-3xs text-dim">2</span></button>`;
  $("toolbar").innerHTML = `<div class="flex flex-wrap items-center gap-2 border-b border-hairline-soft bg-panel/85 px-3 py-2"><div class="${SEG}" title="Show the schema as Koda's map or as Mermaid, DBML or Graphviz (1–4)">${LOOKS.map((n) => `<button type="button" data-look="${n}" class="${n === ui.look ? SEG_ON : SEG_OFF}">${n}</button>`).join("")}</div>${middle}<span class="grow"></span>${trailing}</div>${ui.pop ? pathPop() : ""}`;
}
function pathPop() {
  const found = ui.from != null && ui.to != null;
