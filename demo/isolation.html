<!doctype html>
<html lang="en" data-theme="dark" data-density="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KodaCode Isolation Demo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/icon.svg">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../assets/koda-ui.css">
<link rel="stylesheet" href="frame.css">
<script src="frame.js"></script>
<script src="shell.js"></script>
</head>
<body>
<div class="stage" id="stage">
<div class="window">
  <div class="titlebar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
  <div id="app" class="min-h-0 grow"></div>
</div>
<div id="ptr"></div>
</div>
<script>
const CHEV = ["m6 9 6 6 6-6"];
const ARROW = ["M5 12h14", "m12 5 7 7-7 7"];
const TERM = ["m4 17 6-6-6-6", "M12 19h8"];
const CHECK = ["M20 6 9 17l-5-5"];
const UP = ["M12 20V5.2", "m5.6 11.6 6.4-6.4 6.4 6.4"];
const CLIP = ["M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"];
const COPY = ["M10 8h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z", "M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"];
const kbd = (k) => `<kbd class="rounded border border-hairline bg-canvas px-1 py-0.5 font-mono text-app-2xs text-muted">${k}</kbd>`;
const centre = `
  <div class="flex h-10 shrink-0 items-center justify-between gap-3 border-b border-hairline bg-panel px-4"><div class="flex min-w-0 items-center gap-2"><span class="truncate font-sans text-app-xs text-muted">Run the webhook tests</span></div><div class="flex shrink-0 items-center gap-3 font-mono text-app-xs text-muted"><span class="flex items-center gap-1">${icon("size-3.5 text-accent-cyan-bright", GLYPH.bolt)}Plan mode: <strong class="text-ink">OFF</strong></span><span class="flex items-center gap-1.5 rounded px-1.5 py-0.5"><strong class="text-accent-cyan-bright">12.4k tok</strong><span class="text-dim">·</span><span>Cache hit <strong class="text-ink">61%</strong></span></span></div></div>
  <div class="flex min-h-0 grow flex-col overflow-hidden p-4"><div class="mx-auto flex w-full max-w-3xl flex-col gap-3">
    <div class="flex items-start gap-2 rounded-lg border border-hairline bg-subtle/60 p-3 font-mono text-app-xs font-semibold leading-relaxed text-accent-cyan-bright shadow-sm">${icon("mt-0.5 size-4 shrink-0", UP)}<p class="min-w-0 font-normal">Run the webhook tests and tell me what fails.</p></div>
    <div class="relative flex flex-col pl-5"><span class="absolute top-2.5 bottom-2.5 left-[7px] w-px bg-hairline"></span>
      <div class="relative"><span class="absolute top-[9px] left-[-17px] size-2 rounded-full border border-dim bg-panel"></span><div class="flex items-center gap-2 px-1.5 py-1 font-mono text-app-xs"><span class="grow"><span class="text-muted">Ran </span><span class="text-ink/90">cargo test webhooks</span></span><span class="text-app-2xs text-dim">6 passed</span></div></div>
    </div>
    <div class="rounded-lg border border-hairline bg-panel p-3 font-mono text-app-xs leading-relaxed text-ink">All 6 webhook tests pass.</div>
  </div></div>
  <div class="relative shrink-0 bg-canvas px-3 pt-2 pb-3"><div class="mx-auto w-full max-w-3xl"><div class="flex w-full flex-col rounded-lg border border-hairline bg-panel/95 p-2 elevated-shadow backdrop-blur-xl transition">
    <div class="relative flex items-start gap-2 px-1">${icon("size-4 shrink-0 text-accent-indigo-bright", GLYPH.sparkle)}<div class="min-w-0 grow py-1 text-app-xs leading-relaxed text-dim">Message the agent · / for commands · @ for agents · ⌘↵ to send</div><span class="flex size-6 shrink-0 items-center justify-center rounded text-dim">${icon("size-4", CLIP)}</span>${kbd("⌘K")}</div>
    <div class="mt-1.5 flex items-center justify-between gap-3 border-t border-hairline-soft px-1 pt-1.5 text-app-2xs text-dim">
      <div class="relative"><button id="chip" type="button"></button><div id="pop"></div></div>
      <div class="flex shrink-0 items-center gap-2 font-mono"><span class="flex items-center gap-1">${kbd("⌘↵")}Send</span><span class="flex items-center gap-1">${kbd("Esc")}Cancel</span><button type="button" class="flex cursor-pointer items-center gap-1 rounded border border-elevated bg-hover px-2.5 py-1 text-app-xs font-medium text-ink transition hover:bg-elevated">Send${icon("size-3 text-dim", UP)}</button></div>
    </div></div></div></div>
  <div id="term"></div>`;

const RUNTIMES = [["default", "Default (Host)", "follows Settings"], ["docker", "Docker", "container, rust"], ["podman", "Podman", "container, rust"], ["host", "Host", "your machine, no isolation"]];
const EDITS_NOTE = "File edits and commands that add, edit, delete or download files. Builds, tests and installs never ask.";
const OUTSIDE_NOTE = "Commands that touch paths outside the project, rewrite git history or change the system. Autonomous tasks never ask, so they run them only when this is Allow.";
const STEP = "flex h-6 w-6 cursor-pointer items-center justify-center bg-subtle text-muted transition hover:bg-hover hover:text-ink disabled:cursor-not-allowed disabled:opacity-40";
const toggle = (on) => `<button type="button" role="switch" aria-checked="${on}" class="flex h-5 w-9 shrink-0 cursor-pointer items-center rounded-full border ${on ? "border-accent-cyan/35 bg-accent-cyan/12" : "border-hairline bg-subtle"} px-0.5 disabled:cursor-not-allowed disabled:opacity-50"><div class="${on ? "ml-auto size-3.5 rounded-full bg-accent-cyan-bright" : "size-3.5 rounded-full bg-dim"}"></div></button>`;
const row = (title, note, control) => `<div class="flex min-h-9 items-center justify-between gap-3 border-t border-hairline-soft px-3 py-1.5"><span class="flex min-w-0 items-center gap-1.5 text-ink/85"><span class="truncate">${title}</span>${note ? `<span class="flex size-3.5 shrink-0 cursor-help items-center justify-center rounded-full border border-dim text-[9px] text-dim" title="${note}">i</span>` : ""}</span>${control}</div>`;
const drop = (value, id, options, chosen) => `<div class="relative min-w-0 min-w-36"><button${id ? ` id="${id}"` : ""} type="button" class="flex w-full min-w-0 cursor-pointer items-center gap-1.5 rounded border border-hairline bg-subtle px-2.5 py-1 text-left font-mono text-app-2xs outline-none transition hover:bg-hover focus:border-accent-cyan/60"><span class="grow truncate font-semibold text-ink">${value}</span>${icon("size-2.5 shrink-0 text-muted", CHEV)}</button>${options ? `<div class="enter absolute z-40 flex max-h-80 w-max min-w-full max-w-[28rem] flex-col overflow-hidden rounded-lg border border-hairline bg-elevated elevated-shadow right-0 top-full mt-1.5"><ul class="flex flex-col overflow-y-auto p-1" role="listbox">${options.map(([slug, label, detail]) => `<li role="presentation"><button id="o-${slug}" type="button" role="option" class="flex h-[30px] w-full cursor-pointer items-center gap-2 rounded-md px-2.5 text-left"><span class="${slug === chosen ? "w-3.5 shrink-0 text-accent-cyan-bright" : "invisible w-3.5 shrink-0"}">${icon("size-3.5", CHECK)}</span><span class="min-w-0 truncate font-mono text-app-xs ${slug === chosen ? "text-accent-cyan-bright" : "text-muted"}">${label}</span>${detail ? `<span class="min-w-0 truncate font-mono text-app-2xs text-dim">${detail}</span>` : ""}</button></li>`).join("")}</ul></div>` : ""}</div>`;
function chip(kind) {
  const container = kind !== "host";
  const tone = container ? ["emerald", "text-accent-emerald-bright"] : ["amber", "text-accent-amber-bright"];
  $("chip").className = `flex max-w-[260px] cursor-pointer items-center gap-1.5 rounded border px-2 py-0.5 font-mono transition border-accent-${tone[0]}/35 bg-accent-${tone[0]}/12 ${tone[1]}`;
  $("chip").innerHTML = `<span class="size-1.5 shrink-0 rounded-full bg-accent-${tone[0]}"></span><span class="truncate">${container ? "Docker · rust · applies directly" : "Host · asks first"}</span>${icon("size-2.5 shrink-0", CHEV)}`;
  document.querySelector("header .uppercase.text-accent-cyan-bright").textContent = container ? "docker" : "host";
}
function pop(kind, listing = false) {
  const container = kind !== "host";
  $("pop").innerHTML = `<div class="enter absolute bottom-full left-0 z-50 mb-2 flex w-80 flex-col rounded-md border border-hairline bg-panel font-mono text-app-xs shadow-xl shadow-black/40" role="menu">
    <div class="flex h-9 shrink-0 items-center justify-between gap-2 px-3"><span class="text-app-3xs font-bold tracking-wider text-muted uppercase">Runs on</span><span class="truncate text-app-2xs text-ink/80">acme-api</span></div>
    ${row("Runs on", null, drop(container ? "Docker" : "Default (Host)", "runtime", listing ? RUNTIMES : null, container ? "docker" : "default"))}
    ${container ? row("Base image", null, drop("Auto-detect")) : ""}
    ${row("Changes in project", EDITS_NOTE, drop(container ? "Default (Apply directly)" : "Default (Ask before each)"))}
    ${row("Outside the project", OUTSIDE_NOTE, drop(container ? "Default (Allow in my sessions)" : "Default (Ask first)"))}
    ${row("Code graph", "Index the code so the agent can ask who calls what.", toggle(true))}
    ${row("Review every turn", "Run a full review after each turn that changes files.", toggle(false))}
    ${row("Tasks at once", "How many autonomous tasks this project may run at once.", `<div class="flex shrink-0 items-center overflow-hidden rounded border border-hairline" role="group"><button type="button" disabled class="${STEP}">−</button><span class="min-w-20 text-center text-dim">Default (4)</span><button type="button" class="${STEP}">+</button></div>`)}
    <button type="button" class="flex cursor-pointer items-center justify-between rounded-b-md border-t border-hairline px-3 py-2 text-app-2xs text-muted transition hover:bg-hover hover:text-ink">Image and defaults…<span class="flex items-center gap-1">Settings${icon("size-3", ARROW)}</span></button>
  </div>`;
}

let tabs = [];
function renderTerm() {
  if (!tabs.length) { $("term").innerHTML = ""; return; }
  const active = tabs.find((t) => t.active);
  $("term").innerHTML = `<div class="relative flex shrink-0 flex-col border-t border-hairline bg-well" style="height:286px">
    <div class="relative flex shrink-0 items-center gap-0.5 border-b border-hairline px-1.5 py-1 font-mono text-app-2xs select-none">
      ${tabs.map((t) => `<button type="button" class="${t.active ? "group flex cursor-pointer items-center gap-1.5 rounded bg-panel px-2 py-1 text-ink shadow-[inset_0_-2px_0_var(--koda-accent-cyan)]" : "group flex cursor-pointer items-center gap-1.5 rounded px-2 py-1 text-dim transition hover:bg-hover hover:text-ink"}"><span class="${t.badge === "HOST" ? "rounded border border-hairline bg-subtle px-1 text-app-3xs tracking-wider text-muted" : "rounded border border-accent-cyan/45 bg-accent-cyan/12 px-1 text-app-3xs tracking-wider text-accent-cyan-bright"}">${t.badge}</span><span class="max-w-40 truncate">${t.label}</span><span role="button" class="rounded px-0.5 text-dim opacity-0 transition group-hover:opacity-100 hover:text-ink">×</span></button>`).join("")}
      <div class="relative"><button id="plus" type="button" class="cursor-pointer rounded px-1.5 py-1 text-muted transition hover:bg-hover hover:text-ink">${icon("size-3", GLYPH.plus)}</button><div id="menu"></div></div>
      <span class="grow"></span>
      <button type="button" class="cursor-pointer rounded px-1.5 py-1 text-muted transition hover:bg-hover hover:text-ink">${icon("size-3", COPY)}</button>
      <button type="button" class="cursor-pointer rounded px-1.5 py-1 text-muted transition hover:bg-hover hover:text-ink">${icon("size-3", CHEV)}</button>
    </div>
    <div id="screen" class="min-h-0 grow overflow-hidden p-3 font-mono text-code leading-relaxed text-ink">${active.lines.join("")}</div></div>`;
}
const line = (html, tone = "text-ink") => `<div class="${tone} whitespace-pre">${html}</div>`;
async function type(id, tab, prompt, command, output) {
  const at = tab.lines.length;
  tab.lines.push(line(`<span class="text-accent-emerald-bright">${prompt}</span> <span class="caret"></span>`));
  renderTerm(); await sleep(450); alive(id);
  let typed = "";
  for (const ch of command) {
    typed += ch;
    tab.lines[at] = line(`<span class="text-accent-emerald-bright">${prompt}</span> ${typed}<span class="caret"></span>`);
    renderTerm(); await sleep(38); alive(id);
  }
  tab.lines[at] = line(`<span class="text-accent-emerald-bright">${prompt}</span> ${command}`);
  await sleep(260); alive(id);
  for (const [text, tone] of output) {
    tab.lines.push(line(text, tone || "text-muted"));
    renderTerm(); await sleep(140); alive(id);
  }
  await sleep(500); alive(id);
}

async function play(id) {
  mountShell(centre);
  tabs = []; renderTerm();
  chip("host"); $("pop").innerHTML = "";
  await sleep(1200); alive(id);
  await click($("chip"), id);
  pop("host");
  await sleep(1800); alive(id);
  await click($("runtime"), id);
  pop("host", true);
  await sleep(1200); alive(id);
  await click($("o-docker"), id);
  chip("docker"); pop("docker");
  await sleep(2600); alive(id);
  await pointTo(document.querySelector("#centre .grow.p-4"), id, 0.85, 0.3);
  $("pop").innerHTML = "";
  await sleep(500); alive(id);
  const terminal = [...document.querySelectorAll("footer span")].find((s) => s.textContent.trim() === "Terminal");
  await click(terminal, id);
  terminal.className = "flex cursor-pointer items-center gap-1 rounded px-1.5 text-accent-cyan-bright transition hover:bg-hover";
  const box = { badge: "DOCKER", label: "acme-api", active: true, lines: [line("Starting the project container…", "text-dim")] };
  tabs = [box]; renderTerm();
  await sleep(900); alive(id);
  const P = "/workspace $";
  await type(id, box, P, "pwd", [["/workspace"]]);
  await type(id, box, P, "ls", [["Cargo.toml  README.md  migrations  src  tests"]]);
  await type(id, box, P, "ls ../shared-config", [["ls: cannot access '../shared-config': No such file or directory", "text-accent-rose"]]);
  await type(id, box, P, "cargo test webhooks", [["test result: ok. 6 passed; 0 failed", "text-accent-emerald-bright"]]);
  await click($("plus"), id);
  $("menu").innerHTML = `<div class="enter absolute top-full left-0 z-40 mt-1.5 flex w-72 flex-col gap-0.5 rounded-lg border border-hairline bg-elevated p-1 elevated-shadow" role="menu">
    <button type="button" role="menuitem" class="flex w-full cursor-pointer flex-col gap-0.5 rounded px-2.5 py-1.5 text-left transition hover:bg-hover"><span class="text-app-xs text-accent-cyan-bright">Project container</span><span class="text-app-2xs text-dim">A shell inside the container this project runs in</span></button>
    <button id="host-shell" type="button" role="menuitem" class="flex w-full cursor-pointer flex-col gap-0.5 rounded px-2.5 py-1.5 text-left transition hover:bg-hover"><span class="text-app-xs text-accent-cyan-bright">Host shell</span><span class="text-app-2xs text-dim">zsh on this machine, in the project folder</span></button></div>`;
  await sleep(1400); alive(id);
  await click($("host-shell"), id);
  box.active = false;
  const host = { badge: "HOST", label: "zsh", active: true, lines: [] };
  tabs.push(host); renderTerm();
  await sleep(400); alive(id);
  await type(id, host, "~/dev/acme-api %", "ls ../shared-config", [["README.md  hosts.toml  retry.toml"]]);
  await sleep(3800); alive(id);
}
$("ptr").outerHTML = POINTER;
fitStage();
loop(play)();
</script>
</body>
</html>
